<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DayZ Base Planner</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

    :root {
      --bg-color: #0b1120;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #6366f1;
      --accent-hover: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --map-bg: #0f172a;
      --grid-color: rgba(255, 255, 255, 0.07);
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .pc-only { display: none !important; }
    .mobile-only { display: none !important; }
    body.is-pc .pc-only { display: flex !important; }
    body.is-mobile .mobile-only { display: flex !important; }

    #ui {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      transition: all 0.3s ease;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    }

    body.is-pc #ui {
      position: relative;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 10px 15px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: flex-start;
      border-radius: 0;
      border: none;
      border-bottom: 1px solid var(--border-color);
      transform: none;
      left: auto;
      top: auto;
    }

    body.is-pc .floating-palette,
    body.is-pc .mobile-only { display: none !important; }

    body.is-mobile #ui {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(300px, 90%, 600px);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 16px;
    }

    #ui div {
      font-weight: 300;
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    #ui span {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }

    button:active { transform: translateY(0); }

    button.outline {
      background: transparent;
      border: 1px solid var(--border-color);
      box-shadow: none;
      color: var(--text-main);
    }

    button.outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    #map-viewport {
      background-color: transparent;
      transition: all 0.3s ease;
    }

    body.is-pc #map-viewport {
      width: 100%;
      height: auto;
      min-height: 80vh;
      overflow: visible;
      position: relative;
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    body.is-pc #map {
      width: 800px;
      height: 800px;
      position: relative;
      background-color: var(--map-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transform: none !important;
    }

    body.is-mobile #map-viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #040712;
      cursor: crosshair;
      touch-action: none;
      display: block;
      padding: 0;
    }

    body.is-mobile #map {
      width: 800px;
      height: 800px;
      position: absolute;
      top: 0;
      left: 0;
      background-color: var(--map-bg);
      transform-origin: 0 0;
    }

    .grid {
      background-image: radial-gradient(var(--grid-color) 1px, transparent 1px);
      background-size: 10px 10px;
      background-position: center center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .building {
      box-sizing: border-box;
      position: absolute;
      cursor: grab;
      border-radius: 8px;
      border-style: solid;
      border-width: 2px;
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05), 0 5px 15px rgba(0, 0, 0, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      user-select: none;
      transition: filter 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      overflow: visible;
      white-space: nowrap;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .measure-label {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    @keyframes popIn {
      0% { scale: 0.5; opacity: 0; }
      100% { scale: 1; opacity: 1; }
    }

    .building:active {
      cursor: grabbing;
      scale: 1.02;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    body.mode-delete .building { cursor: no-drop; }
    body.mode-delete .building:active {
      scale: 0.95;
      background: rgba(239, 68, 68, 0.5) !important;
      border-color: #ef4444 !important;
    }

    body.mode-build .building:not(.preview) { pointer-events: none; }
    body.mode-move .building:not(.preview) { cursor: move; }
    body.mode-move .building:not(.preview):active { cursor: grabbing; }

    .invalid {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
      box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.3) !important;
    }

    .preview {
      opacity: 0.7;
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 0.8; }
      100% { opacity: 0.6; }
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-right: auto;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title::before {
      content: '🏕️';
      font-size: 1.5rem;
    }

    .building-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .arrow-btn {
      background: transparent;
      color: var(--text-main);
      box-shadow: none;
      padding: 5px 8px;
      font-size: 1.2rem;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
      transform: scale(1.1);
    }

    .building-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 180px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .building-info.fade-out { opacity: 0; transform: translateY(-10px); }
    .building-info.fade-in { opacity: 1; transform: translateY(0); }

    .tool-btn { display: flex; align-items: center; gap: 6px; }
    .tool-btn.active { background: var(--text-main); color: var(--bg-color); }

    .building-name { font-weight: 600; font-size: 1rem; }
    .building-desc { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-bottom: 3px; }
    .building-price { font-size: 0.8rem; color: #fbbf24; font-weight: 600; }

    #selector-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    .mobile-selector-handle {
      width: 50px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 5px 0 10px 0;
      cursor: pointer;
      display: none;
    }

    body.is-mobile .mobile-selector-handle { display: block; }

    body.is-mobile #selector-container.collapsed {
      height: 20px;
      overflow: hidden;
      opacity: 0.5;
    }

    body.is-mobile #selector-container.collapsed .building-selector {
      pointer-events: none;
      transform: translateY(10px);
      opacity: 0;
      height: 0;
      margin: 0;
    }

    body.is-mobile #ui.is-collapsed {
      padding: 5px 10px !important;
      gap: 0 !important;
      min-height: 30px;
    }

    body.is-mobile #ui.is-collapsed .app-title {
      font-size: 0 !important;
      gap: 0 !important;
      margin: 0 !important;
      justify-content: center;
    }

    body.is-mobile #ui.is-collapsed .app-title::before { display: none !important; }

    body.is-mobile #ui.is-collapsed #user-badge {
      font-size: 0.7rem !important;
      margin: 0 auto !important;
      display: block !important;
    }

    body.is-mobile #ui.is-collapsed #admin-badge { display: none !important; }
    body.is-mobile #ui.is-collapsed .mobile-selector-handle { margin: 2px 0 5px 0; }
    body.is-mobile #ui:not(.is-collapsed)~.floating-palette { display: none !important; }

    #zoom-controls {
      top: 140px !important;
      right: 20px !important;
      left: auto !important;
      transform: none !important;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-value { color: #fbbf24; font-weight: 600; }

    .smart-guide {
      position: absolute;
      background-color: #0ea5e9;
      box-shadow: 0 0 5px #0ea5e9;
      pointer-events: none;
      display: none;
      z-index: 50;
    }

    .smart-guide.vertical { width: 1px; }
    .smart-guide.horizontal { height: 1px; }

    .guide-label {
      position: absolute;
      background: #0ea5e9;
      color: #fff;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }

    .smart-guide.vertical .guide-label { left: 4px; top: 50%; transform: translateY(-50%); }
    .smart-guide.horizontal .guide-label { bottom: 4px; left: 50%; transform: translateX(-50%); }

    #confirm-place-btn {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) scale(0.7);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid #fff;
      color: white;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(34, 197, 94, 0.6);
      cursor: pointer;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 0;
    }

    #confirm-place-btn.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) scale(1);
      animation: confirmPulse 1.8s ease-in-out infinite;
    }

    #confirm-place-btn.invalid-state {
      background: #475569;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: none;
      pointer-events: none;
      opacity: 0.5;
    }

    @keyframes confirmPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(34, 197, 94, 0.6), 0 0 0 0 rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 8px 32px rgba(34, 197, 94, 0.8), 0 0 0 14px rgba(34, 197, 94, 0); }
    }

    .wall-start-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.8), 0 0 20px rgba(251, 191, 36, 0.4);
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%, -50%);
      animation: dotPulse 1s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.8), 0 0 20px rgba(251, 191, 36, 0.4); transform: translate(-50%, -50%) scale(1); }
      50% { box-shadow: 0 0 15px rgba(251, 191, 36, 1), 0 0 30px rgba(251, 191, 36, 0.6); transform: translate(-50%, -50%) scale(1.3); }
    }

    #wall-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #fbbf24;
      color: #fbbf24;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #wall-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .login-box {
      background: var(--panel-bg);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-box h2 { margin: 0 0 10px 0; text-align: center; }
    .login-box input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-family: 'Outfit', sans-serif;
      outline: none;
    }

    .login-box button {
      padding: 10px;
      border-radius: 6px;
      background: var(--accent-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .login-box button:hover { background: var(--accent-hover); }

    .login-toggle {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 10px;
    }

    .login-toggle:hover { color: white; text-decoration: underline; }

    .admin-badge {
      background: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-left: 10px;
      display: none;
    }

    .user-badge { font-size: 0.8rem; color: #38bdf8; margin-left: 10px; }

    #admin-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .admin-box {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .admin-box h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .admin-table th, .admin-table td { padding: 10px; border: 1px solid var(--border-color); text-align: left; }
    .admin-table th { background: rgba(255, 255, 255, 0.05); }

    .view-btn { background: var(--accent-color); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

    .floating-palette {
      position: fixed;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #construction-tools { left: 20px; bottom: 20px; }
    #system-tools { right: 20px; bottom: 20px; }

    .circle-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
      position: relative;
    }

    .circle-btn:hover {
      background: var(--accent-color);
      transform: scale(1.1);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.4);
    }

    .circle-btn.active { background: var(--accent-color); border-color: #fff; }

    .circle-btn.danger:hover {
      background: #ef4444;
      box-shadow: 0 12px 40px rgba(239, 68, 68, 0.4);
    }

    .btn-toggle { background: var(--accent-hover); font-size: 1rem; font-weight: bold; }

    .palette-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px;
      margin: -8px;
      overflow: visible;
      max-height: 516px;
      transition: max-height 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    }

    .palette-content.hidden {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      padding-top: 0;
      padding-bottom: 0;
    }

    .circle-btn.active {
      background: var(--accent-color);
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.5), 0 8px 24px rgba(99, 102, 241, 0.6);
    }

    #mobile-actions {
      position: fixed;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      #ui { flex-direction: column; height: auto; padding: 10px; gap: 15px; align-items: center; }
      .app-title { font-size: 1.1rem !important; margin-bottom: 5px; }
      .building-selector { width: 100%; max-width: 400px; transform: none; margin: 0; justify-content: space-between; padding: 10px 15px; }
      .arrow-btn { padding: 10px 15px !important; font-size: 1.5rem !important; }
      .building-name { font-size: 1.1rem !important; }
      .building-desc { font-size: 0.85rem !important; }
      .building-info { flex: 1; min-width: 0; }
      .tool-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; border-left: none !important; padding-left: 0 !important; border-top: 1px solid var(--border-color); padding-top: 15px; width: 100%; }
      .tool-btn { padding: 12px 16px !important; font-size: 0.9rem !important; min-width: 80px; }
      #right-toolbar { right: 15px; bottom: 30px; top: auto; transform: none; flex-direction: row; padding: 8px; border-radius: 25px; }
      #right-toolbar button { width: 48px; height: 48px; border-radius: 50%; font-size: 1.1rem; }
      .login-box, .creator-box, .admin-box { width: 90% !important; max-width: 350px; padding: 25px !important; }
    }

    #creator-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(15px);
    }

    .creator-box {
      background: var(--panel-bg);
      padding: 30px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      width: 400px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .creator-box h2 { margin: 0 0 10px 0; text-align: center; }

    .creator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .creator-box label { font-size: 0.8rem; color: var(--text-muted); }
    .creator-box input, .creator-box select { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.3); color: white; outline: none; }
    .creator-box .full-width { grid-column: span 2; }

    .creator-actions { display: flex; gap: 10px; margin-top: 10px; }
    .creator-actions button { flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
    .btn-save-item { background: var(--accent-color); color: white; }
    .btn-cancel-item { background: rgba(255, 255, 255, 0.1); color: white; }
  </style>
</head>

<body>

  <div id="wall-toast">📍 Ahora toca para poner el punto final del muro</div>
  <button id="confirm-place-btn" onclick="confirmPlacement()">✓</button>

  <div id="login-screen">
    <div class="login-box">
      <h2 id="login-title">Iniciar Sesión</h2>

      <input type="password" id="login-pass" placeholder="Contraseña">
      <button onclick="handleAuth()" id="login-btn">Entrar</button>
